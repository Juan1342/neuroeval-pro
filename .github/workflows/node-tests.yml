name: Node tests

on:
  push:
    branches:
      - feature/global-launch-prep
  pull_request:
    branches:
      - mejoras/neuroeval-pro
      - feature/global-launch-prep

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
