name: ES-EN and world map checks
# Run server, browser-module syntax checks and regression tests on the final feature branch, including localized formatting.

on:
  push:
    branches:
      - release/es-en-world-map
  pull_request:
    branches:
      - mejoras/neuroeval-pro

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: node --check server.js && node --input-type=module --check < public/app.js && npm test
