name: ES-EN and world map checks
# Run server, browser-module syntax checks and regression tests on the final feature branch, including explicit regional consent, privacy-thresholded aggregates and report localization and cache invalidation after consent changes.

on:
  push:
    branches:
      - release/es-en-world-map
  pull_request:
    branches:
      - mejoras/neuroeval-pro

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run automated and browser tests
        run: node --check server.js && node --input-type=module --check < public/app.js && npm test && npx playwright test
      - name: Upload browser traces and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neuroeval-browser-test-results
          path: test-results/
          if-no-files-found: ignore
