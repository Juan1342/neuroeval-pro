name: Verificación de NeuroEval Pro

on:
  push:
    branches:
      - mejoras/neuroeval-pro
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar sintaxis
        run: |
          node --check server.js
          node --check bootstrap-admin.js
          node --check public/app.js
          node --check lib/evaluation.js
          node --check lib/payment-state.js

      - name: Ejecutar pruebas
        run: npm test
